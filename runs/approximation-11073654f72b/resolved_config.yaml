project: hypergraph_cluster_expansion
dtype: float64
seed: 11
paths:
  runs: runs
preprocess:
  binary_incidence: true
  min_edge_size: 1
  max_edge_size: null
  deduplicate_within_edge: true
  merge_duplicate_edges: true
  preserve_declared_vertices: true
  simplicial_closure: false
spectrum:
  side: auto
  full_eigenvalues: true
  preserve_zero_multiplicity: true
  psd_relative_tolerance: 1.0e-10
  memory_budget_gb: 8
features:
  x_log10_min: -2
  x_log10_max: 1
  num_scales: 12
  scale_policy: train_median_lambda_max
  include_U: true
  include_normalized_entropy: true
  include_free_energy: false
sources:
  hic:
    IMDB_dir_genre:
      path: data/raw/hic/IMDB/IMDB_dir_genre.txt
      index_base: 0
    stream_player:
      path: data/raw/hic/STEAM/stream_player.txt
      index_base: 0
  scholp:
    email_Enron:
      directory: data/raw/email-Enron-full
      timestamp_unit: milliseconds
      timestamp_origin: '0001-01-01T00:00:00+00:00'
      timestamp_origin_status: inferred_from_serial_encoding_and_reference_range
      timezone: UTC
      variant: full
    congress_bills:
      directory: data/raw/congress-bills-full
      timestamp_unit: days
      timestamp_origin: '0001-01-01T00:00:00+00:00'
      timestamp_origin_status: inferred_from_serial_encoding_and_reference_range
      timezone: UTC
      variant: full
  school: {}
output:
  save_predictions: true
  save_raw_curves: true
  table_formats:
  - csv
  - parquet
  figure_formats:
  - pdf
  - png
  png_dpi: 300
approximation:
  datasets:
  - IMDB_dir_genre
  - stream_player
  scholp_datasets:
  - email_Enron
  - congress_bills
  x_grid:
  - 0.01
  - 0.03
  - 0.1
  - 0.3
  - 1
  - 3
  forward_thresholds:
  - 0.01
  - 0.05
  inverse_relative_thresholds:
  - 0.05
  - 0.1
  dimensionless_degeneracy_tolerance: 1.0e-12
  report_invalid_cases: true
  parallel_workers: 2
  progress_every_samples: 1
  resume: true
  sample_ids:
  - IMDB_dir_genre:000000
  - IMDB_dir_genre:000001
  - stream_player:000000
  - stream_player:000001
benchmark:
  queries_J:
  - 1
  - 12
  - 80
  warmups: 0
  repetitions: 1
  blas_threads: 1
  samples_per_dataset: 2
  max_exact_g_dimension: 2000
  query_timing_loops: 10
