# Copy these entries into base.yaml or an experiment override after downloading and
# hashing the official sources. Do not replace full data silently with size<=25 data.
sources:
  hic:
    IMDB_dir_genre:
      path: data/raw/hic/IMDB/IMDB_dir_genre.txt
      index_base: 0
    stream_player:
      path: data/raw/hic/STEAM/stream_player.txt
      index_base: 0
    IMDB_dir_form:
      path: data/raw/hic/IMDB/IMDB_dir_form.txt
      index_base: 0
  scholp:
    email_Enron:
      directory: data/raw/email-Enron-full
      timestamp_unit: milliseconds
      timestamp_origin: null
      timezone: null
      variant: full
    congress_bills:
      directory: data/raw/congress-bills-full
      timestamp_unit: days
      timestamp_origin: null
      timezone: null
      variant: full
  school:
    contacts_path: data/raw/primaryschool/primaryschool.csv
    metadata_path: data/raw/primaryschool/primaryschool_metadata.txt
    source_dates: [2009-10-01, 2009-10-02]

